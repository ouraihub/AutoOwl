name: release

# Push a tag `v<version>` (matching package.json, Cargo.toml and tauri.conf.json)
# to build and publish a GitHub Release with an installer and a portable exe.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Enforce runner compiler ownership
        shell: cmd
        run: call node_modules\@ouraihub\desktop-kit\msvc\msvc-env.bat
      - name: Tag must match the app version
        env:
          TAG: ${{ github.ref_name }}
        run: pnpm exec desktop-kit version "$env:TAG"
      # Runs the verify gate (same as CI) first, so a red commit is never published.
      - name: Build installer and portable exe
        run: pnpm run build:app
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory dist/candidates | Out-Null
          Move-Item dist/candidate-windows dist/candidates/candidate-windows
          pnpm exec desktop-kit publish "$env:TAG"
